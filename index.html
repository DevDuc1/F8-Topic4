<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/style.css" />
        <title>About Us</title>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="nav-head">
                    <ul>
                        <li><a class="active" href="#!">Home</a></li>
                        <li><a href="#!">Pages</a></li>
                        <li><a href="#!">Articles</a></li>
                    </ul>
                </div>
                <a href="#!"><img src="./images/logo.png" alt="logo" /></a>
                <div class="nav-head">
                    <ul>
                        <li><a href="#!">Contact</a></li>
                        <li><a href="#!">Shop</a></li>
                        <li><a href="#!">Locations</a></li>
                    </ul>
                </div>
            </header>
            <a href="#!"
                ><img src="./images/hero.jpg" alt="img-hero" class="hero"
            /></a>
            <div class="slogan">BECAUSE WE LOVE COFFEE</div>
            <main>
                <div class="about">
                    <a href="#!"><h1>About Us</h1></a>
                    <div class="wrap-content-about">
                        <div class="content">
                            <div class="item">
                                <a href="#!"
                                    ><img src="./images/latte.jpg" alt="latte"
                                /></a>
                            </div>
                            <div class="item">
                                <p class="active">OUR MISSION</p>
                                <a href="#!"
                                    ><h2>
                                        It all began with a modest concept:
                                        Create amazing coffee
                                    </h2></a
                                >
                            </div>
                            <div class="item">
                                <a href="#!"
                                    ><img
                                        src="./images/espresso-machine.jpg"
                                        alt="espresso"
                                /></a>
                            </div>
                            <div class="item">
                                <p class="active">HOME DELIVERY</p>
                                <a href="#!"
                                    ><h2>
                                        Quality coffee delivered to your door
                                    </h2></a
                                >
                            </div>
                            <div class="item">
                                <a href="#!"
                                    ><img
                                        src="./images/coffee-book.jpg"
                                        alt="coffee"
                                /></a>
                            </div>
                            <div class="item">
                                <p class="active">TIME TO CHILL</p>
                                <a href="#!"
                                    ><h2>Black Coffee Shaved Ice</h2></a
                                >
                            </div>
                        </div>
                        <a href="#!"
                            ><img
                                class="last-img"
                                src="./images/last-img.jpg"
                                alt="img"
                        /></a>
                    </div>
                </div>
            </main>
            <footer>
                <img src="./images/logo.png" alt="logo" />
                <form action="#!">
                    <input
                        type="email"
                        placeholder="Enter email address..."
                        required
                    />
                    <button>Contact Us</button>
                </form>
            </footer>
        </div>
    </body>
</html>
